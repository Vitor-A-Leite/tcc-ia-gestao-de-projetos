[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alfa-documental-v2"
version = "2.0.0"
description = "Motor híbrido Alfa com análise seletiva e revisão documental offline"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
packages = ["alfa_documental_v2", "alfa_documental_v2.tests", "alfa_documental_v2.src", "alfa_documental_v2.src.vendor", "alfa_documental_v2.src.vendor.orquestracao", "alfa_documental_v2.src.vendor.motor_deterministico", "alfa_documental_v2.src.vendor.hibrido_v07_r3", "alfa_documental_v2.src.vendor.hibrido_v05", "alfa_documental_v2.src.vendor.interpretacao_no"]
package-dir = {alfa_documental_v2 = "."}

[tool.setuptools.package-data]
alfa_documental_v2 = ["data/projetos/alfa/*.json", "data/projetos/alfa/cenarios/dev/*.json", "data/projetos/alfa/simulacoes/dev/*.json", "avaliacao/*.json", "avaliacao/referencias/dev/*.json", "web/*.html", "web/*.js", "web/*.css", "MANIFESTO_ORIGENS.json", "docs/*.json", "docs/*.md", "README.md"]
